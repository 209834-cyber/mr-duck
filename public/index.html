<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck & Lemon Tycoon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #111827; color: #f9fafb; margin: 0; padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .card { background: #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 20px; }
    h1, h2, h3 { margin-top: 0; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat-box { background: #374151; padding: 10px; border-radius: 8px; text-align: center; }
    .stat-value { font-size: 1.25rem; font-weight: bold; color: #f59e0b; }
    .stat-label { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; }
    
    button {
      background: #f59e0b; color: #111827; border: none; padding: 10px 16px;
      font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin: 2px;
    }
    button:hover { background: #d97706; }
    button:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
    
    .tab-buttons { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid #374151; padding-bottom: 10px; }
    .tab-btn { background: #374151; color: #f9fafb; }
    .tab-btn.active { background: #f59e0b; color: #111827; }
    
    .grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto; }
    .item-card { background: #374151; padding: 10px; border-radius: 8px; text-align: center; }
    
    .admin-card { border: 2px solid #ef4444; background: #2a1215; }
    .world-btn { background: #3b82f6; color: white; }
    .world-btn:hover { background: #2563eb; }
    
    input { background: #374151; border: 1px solid #4b5563; color: #fff; padding: 8px 12px; border-radius: 6px; width: 100%; margin-bottom: 8px; }
    #chat-box { height: 200px; overflow-y: auto; background: #111827; border-radius: 6px; padding: 10px; font-size: 0.875rem; margin-bottom: 10px; }
    .chat-msg { margin-bottom: 4px; }
    .chat-name { font-weight: bold; color: #f59e0b; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Main Left Column -->
    <div>
      <h1>🦆 Duck & Lemon Tycoon</h1>

      <!-- Stats -->
      <div class="card">
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-value" id="coins">0</div><div class="stat-label">Coins</div></div>
          <div class="stat-box"><div class="stat-value" id="lemons">0</div><div class="stat-label">Lemons</div></div>
          <div class="stat-box"><div class="stat-value" id="income">0/s</div><div class="stat-label">Income</div></div>
          <div class="stat-box"><div class="stat-value" id="rebirths">0</div><div class="stat-label">Rebirths</div></div>
          <div class="stat-box"><div class="stat-value" id="current-world">1</div><div class="stat-label">World</div></div>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button onclick="sendAct('PickLemons')">🍋 Pick Lemons</button>
          <button onclick="sendAct('SellLemons')">💰 Sell Lemons</button>
          <button onclick="sendAct('UpgradeLemon')">⬆️ Upgrade Business</button>
          <button onclick="sendAct('Rebirth')">🔄 Rebirth</button>
        </div>
      </div>

      <!-- Worlds Navigation -->
      <div class="card">
        <h3>🌐 Travel Worlds</h3>
        <button class="world-btn" onclick="sendAct('SwitchWorld', 1)">World 1: Classic Pond</button>
        <button class="world-btn" onclick="sendAct('SwitchWorld', 2)">World 2: Golden Realm (Req: 1 Rebirth)</button>
        <button class="world-btn" onclick="sendAct('SwitchWorld', 3)">World 3: Galactic Nebula (Req: 5 Rebirths)</button>
      </div>

      <!-- Tabs & Store -->
      <div class="card">
        <div class="tab-buttons">
          <button class="tab-btn active" onclick="showTab('ducks')">🦆 Duck Market</button>
          <button class="tab-btn" onclick="showTab('upgrades')">🏢 Upgrades</button>
        </div>

        <div id="tab-ducks">
          <p>Slots: <span id="slots-used">0</span>/<span id="slots-max">0</span></p>
          <div class="grid-list" id="duck-shop"></div>
        </div>

        <div id="tab-upgrades" style="display: none;">
          <h3>Business Upgrade</h3>
          <p id="upgrade-name">Lemonade Stand</p>
          <p id="upgrade-cost">Cost: 100 Coins</p>
        </div>
      </div>
    </div>

    <!-- Right Column (Chat & Admin) -->
    <div>
      <!-- Live Chat & Board -->
      <div class="card">
        <h3>💬 Pond Chat</h3>
        <div id="chat-box"></div>
        <input type="text" id="chat-input" placeholder="Say something..." onkeydown="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()" style="width: 100%;">Send</button>
      </div>

      <!-- Admin Panel -->
      <div class="card admin-card">
        <h3 style="color: #ef4444;">⚡ Admin Panel</h3>
        <div id="admin-login-box">
          <input type="password" id="admin-code-input" placeholder="Admin Secret Code">
          <button onclick="loginAdmin()" style="width: 100%;">Login</button>
        </div>

        <div id="admin-controls-box" style="display: none;">
          <p style="color: #4ade80; font-weight: bold; margin-top: 0;">Admin Authenticated</p>
          
          <p><strong>Teleport Players</strong></p>
          <button onclick="adminTeleportAll(1)">All -> World 1</button>
          <button onclick="adminTeleportAll(2)">All -> World 2</button>
          <button onclick="adminTeleportAll(3)">All -> World 3</button>

          <p><strong>Events & Gifts</strong></p>
          <button onclick="adminDuckRain()">🌧️ Duck Rain</button>
          <button onclick="adminLuckyHour(5, 10)">x5 Boost (10m)</button>
          <button onclick="adminClearBuffs()">Clear Buffs</button>
          
          <input type="number" id="gift-coins" placeholder="Coin Amount" style="margin-top: 8px;">
          <button onclick="adminGiveCoins(document.getElementById('gift-coins').value)">Give Coins</button>
          
          <input type="number" id="duck-tier" placeholder="Duck Tier (1-1000)" style="margin-top: 8px;">
          <button onclick="adminGiftDuck(document.getElementById('duck-tier').value)">Gift Tier Duck</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script>
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocol}//${location.host}`);
    window.gameSocket = ws;

    let token = localStorage.getItem("duck_tycoon_token");
    if (!token) {
      token = Math.random().toString(36).substring(2) + Date.now().toString(36);
      localStorage.setItem("duck_tycoon_token", token);
    }

    ws.onopen = () => {
      ws.send(JSON.stringify({ t: "login", token, name: "Player" }));
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.t === "state") {
        document.getElementById("coins").innerText = Config.Format(msg.Coins);
        document.getElementById("lemons").innerText = Config.Format(msg.Lemons);
        document.getElementById("income").innerText = Config.Format(msg.Income) + "/s";
        document.getElementById("rebirths").innerText = msg.Rebirths;
        document.getElementById("current-world").innerText = msg.World;
        document.getElementById("slots-used").innerText = msg.Total;
        document.getElementById("slots-max").innerText = msg.Slots;

        renderDuckShop(msg.Coins, msg.Ducks);
      } else if (msg.t === "chat") {
        addChat(msg.name, msg.msg);
      } else if (msg.t === "admin_ok") {
        document.getElementById("admin-login-box").style.display = "none";
        document.getElementById("admin-controls-box").style.display = "block";
      } else if (msg.t === "admin_err") {
        alert("Admin error: " + msg.msg);
      } else if (msg.t === "banner") {
        addChat("📢 SYSTEM", msg.msg);
      }
    };

    function renderDuckShop(userCoins, userDucks) {
      const shop = document.getElementById("duck-shop");
      shop.innerHTML = "";
      // Render first 20 ducks for UI efficiency
      for (let i = 1; i <= 20; i++) {
        const cost = Config.DuckCost(i);
        const name = Config.DuckNames[i - 1] || `Duck #${i}`;
        const count = userDucks[i - 1] || 0;

        const div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
          <div><strong>${name}</strong></div>
          <div style="font-size: 0.8rem; color: #aaa;">Owned: ${count}</div>
          <div style="font-size: 0.8rem; margin: 4px 0;">Cost: ${Config.Format(cost)}</div>
          <button onclick="sendAct('BuyDuck', ${i})" ${userCoins < cost ? "disabled" : ""}>Buy</button>
        `;
        shop.appendChild(div);
      }
    }

    function sendAct(action, arg) {
      ws.send(JSON.stringify({ t: "act", a: action, arg }));
    }

    function sendChat() {
      const input = document.getElementById("chat-input");
      if (input.value.trim()) {
        ws.send(JSON.stringify({ t: "chat", msg: input.value.trim() }));
        input.value = "";
      }
    }

    function addChat(name, msg) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = "chat-msg";
      div.innerHTML = `<span class="chat-name">${name}:</span> ${msg}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function showTab(tab) {
      document.getElementById("tab-ducks").style.display = tab === "ducks" ? "block" : "none";
      document.getElementById("tab-upgrades").style.display = tab === "upgrades" ? "block" : "none";
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
    }

    function loginAdmin() {
      const code = document.getElementById("admin-code-input").value;
      ws.send(JSON.stringify({ t: "admin_login", code }));
    }
  </script>
</body>
</html>
