<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck & Lemon Tycoon</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    button { background: #FFC107; border: none; padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 4px; margin: 2px; }
    button:hover { background: #FFD54F; }
    .admin-panel { background: #3a1c1c; border: 1px solid #ff4444; }
    .world-btn { background: #2196F3; color: white; }
    input { padding: 8px; margin: 2px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🦆 Duck & Lemon Tycoon</h1>

    <!-- Stats Dashboard -->
    <div class="card">
      <h2>Stats</h2>
      <p>Coins: <span id="coins">0</span> | Lemons: <span id="lemons">0</span></p>
      <p>Income: <span id="income">0</span>/sec | Current Stage: <span id="stage">1</span></p>
      <p>Rebirths: <span id="rebirths">0</span> | Current World: <span id="current-world">1</span></p>
      <button onclick="sendAct('PickLemons')">🍋 Pick Lemons</button>
      <button onclick="sendAct('SellLemons')">💰 Sell Lemons</button>
      <button onclick="sendAct('UpgradeLemon')">⬆️️ Upgrade Business</button>
      <button onclick="sendAct('Rebirth')">🔄 Rebirth</button>
    </div>

    <!-- World Selector -->
    <div class="card">
      <h2>🌐 Travel Worlds</h2>
      <button class="world-btn" onclick="sendAct('SwitchWorld', 1)">World 1: Classic Pond</button>
      <button class="world-btn" onclick="sendAct('SwitchWorld', 2)">World 2: Golden Realm (Req: 1 Rebirth)</button>
      <button class="world-btn" onclick="sendAct('SwitchWorld', 3)">World 3: Galactic Nebula (Req: 5 Rebirths)</button>
    </div>

    <!-- Admin Login & Command Controls -->
    <div class="card admin-panel">
      <h2>⚡ Admin Controls</h2>
      <div id="admin-login-box">
        <input type="password" id="admin-code-input" placeholder="Enter Admin Code">
        <button onclick="loginAdmin()">Login as Admin</button>
      </div>

      <div id="admin-controls-box" style="display: none; margin-top: 10px;">
        <p style="color: #ff8888;">Logged in as Admin!</p>
        
        <div>
          <h3>Teleport All Players</h3>
          <button onclick="adminTeleportAll(1)">Teleport All -> World 1</button>
          <button onclick="adminTeleportAll(2)">Teleport All -> World 2</button>
          <button onclick="adminTeleportAll(3)">Teleport All -> World 3</button>
        </div>

        <hr style="border-color: #555;">

        <div>
          <h3>Global Events & Buffs</h3>
          <button onclick="adminLuckyHour(5, 10)">x5 Lucky Hour (10m)</button>
          <button onclick="adminDuckRain()">🌧️ Trigger Duck Rain</button>
          <button onclick="adminClearBuffs()">Clear Buffs</button>
        </div>

        <hr style="border-color: #555;">

        <div>
          <h3>Player Gifts & Edits</h3>
          <input type="number" id="gift-coin-amt" placeholder="Coin Amount" value="1000000">
          <button onclick="adminGiveCoins(document.getElementById('gift-coin-amt').value)">Give Coins to All</button>

          <br><br>

          <input type="number" id="duck-tier-input" placeholder="Duck Tier (1-1000)" min="1" max="1000">
          <button onclick="adminGiftDuck(document.getElementById('duck-tier-input').value)">Gift Duck Tier</button>

          <br><br>

          <input type="number" id="rebirth-input" placeholder="Set Rebirths">
          <button onclick="adminSetRebirths(document.getElementById('rebirth-input').value)">Set All Player Rebirths</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script>
    // Connection handling & socket message setup
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocol}//${location.host}`);
    window.gameSocket = ws;

    let token = localStorage.getItem("duck_tycoon_token");
    if (!token) {
      token = Math.random().toString(36).substring(2) + Date.now().toString(36);
      localStorage.setItem("duck_tycoon_token", token);
    }

    ws.onopen = () => {
      ws.send(JSON.stringify({ t: "login", token, name: "Player" }));
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.t === "state") {
        document.getElementById("coins").innerText = Config.Format(msg.Coins);
        document.getElementById("lemons").innerText = Config.Format(msg.Lemons);
        document.getElementById("income").innerText = Config.Format(msg.Income);
        document.getElementById("stage").innerText = msg.Stage;
        document.getElementById("rebirths").innerText = msg.Rebirths;
        document.getElementById("current-world").innerText = msg.World;
      } else if (msg.t === "admin_ok") {
        document.getElementById("admin-login-box").style.display = "none";
        document.getElementById("admin-controls-box").style.display = "block";
      } else if (msg.t === "admin_err") {
        alert("Admin error: " + msg.msg);
      } else if (msg.t === "banner") {
        alert(msg.msg);
      }
    };

    function sendAct(action, arg) {
      ws.send(JSON.stringify({ t: "act", a: action, arg }));
    }

    function loginAdmin() {
      const code = document.getElementById("admin-code-input").value;
      ws.send(JSON.stringify({ t: "admin_login", code }));
    }
  </script>
</body>
</html>
<script src="admin1.js"></script>
</body>
</html>
