<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck & Lemon Tycoon</title>
<style>
  :root { --bg:#7ed6f4; --panel:#fff8d6; --dark:#22303c; --accent:#e6b800; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Trebuchet MS", system-ui, sans-serif; background: linear-gradient(#bfeaff,#7ed6f4); color:var(--dark); min-height:100vh; padding-top: 36px; }
  
  #login { position:fixed; inset:0; background:rgba(20,30,40,.85); display:flex; align-items:center; justify-content:center; z-index:100; }
  #login .box { background:var(--panel); padding:28px; border-radius:16px; text-align:center; width:min(90vw,340px); }
  #login input { width:100%; padding:10px; font-size:18px; border-radius:8px; border:2px solid #cbb; margin:12px 0; }
  
  button { font-family:inherit; font-weight:bold; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; color:#fff; font-size:15px; transition: transform 0.1s, opacity 0.2s; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:active:not(:disabled) { transform:scale(.97); }
  
  header { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:10px; background:var(--dark); color:#fff; font-weight:bold; z-index: 10; position: relative; }
  header span { background:#34495e; padding:6px 12px; border-radius:20px; font-size: 14px; }
  
  main { display:grid; grid-template-columns: 260px 1fr 300px; gap:12px; padding:12px; max-width:1300px; margin:auto; }
  @media (max-width:950px){ main { grid-template-columns:1fr; } }
  
  .panel { background:var(--panel); border-radius:14px; padding:12px; box-shadow:0 3px 0 rgba(0,0,0,.15); }
  .panel h3 { margin:0 0 8px; }
  .col { display:flex; flex-direction:column; gap:12px; }
  .btn-col { display:flex; flex-direction:column; gap:8px; }
  
  #lemon { background:#e6b800; font-size:18px; padding:14px; }
  #sell { background:#3aa655; }
  #upgrade { background:#4a6fdc; }
  #rebirth { background:#aa3cc8; }
  .toggle-btn { background:#6c757d; font-size:13px; }
  .toggle-btn.active { background:#27ae60; }
  
  #pond { background: radial-gradient(ellipse at center,#5cc3ee,#3aa0d0); border-radius:14px; min-height:320px; padding:12px; display:grid; grid-template-columns:repeat(10,1fr); gap:4px; align-content:start; box-shadow: inset 0 0 30px rgba(0,0,0,.25); }
  .duck { text-align:center; line-height:1; animation: bob 2s ease-in-out infinite; user-select:none; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  
  #shop { max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .shopitem { display:flex; justify-content:space-between; align-items:center; text-align:left; color:#111; border:2px solid rgba(0,0,0,.15); }
  .shopitem small { display:block; font-weight:normal; opacity:.75; }
  
  #chatlog { height:150px; overflow-y:auto; background:#fff; border-radius:8px; padding:6px; font-size:13px; }
  #chatin { width:100%; padding:8px; border-radius:8px; border:2px solid #cbb; margin-top:6px; }
  ol,ul { margin:0; padding-left:20px; font-size:14px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff; padding:10px 18px; border-radius:20px; display:none; z-index:90; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>🦆 Duck & Lemon Tycoon 🍋</h1>
    <p>Pick a name to join the pond</p>
    <input id="nameIn" maxlength="16" placeholder="Your name">
    <button id="joinBtn" style="background:#e6b800;width:100%">Play!</button>
  </div>
</div>

<header>
  <span id="coins">💰 0</span>
  <span id="lemons">🍋 0</span>
  <span id="eggs">🥚 0</span>
  <span id="ducks">🦆 0/10</span>
  <span id="stage">Lemon Stand</span>
  <span id="reb">🔄 x1</span>
</header>

<main>
  <div class="col">
    <div class="panel btn-col">
      <h3>Lemon Business</h3>
      <button id="lemon">🍋 Pick Lemons</button>
      <button id="sell">💰 Sell Lemons</button>
      <button id="upgrade">Upgrade Stage</button>
      <button id="rebirth">Rebirth</button>
      
      <div style="display:flex; gap:6px; margin-top:4px;">
        <button id="autoPickBtn" class="toggle-btn" style="flex:1;">🤖 Auto-Pick: OFF</button>
        <button id="autoSellBtn" class="toggle-btn" style="flex:1;">⚡ Auto-Sell: OFF</button>
      </div>
    </div>
    <div class="panel"><h3>Online 🌐</h3><ul id="online"></ul></div>
  </div>

  <div class="col">
    <div class="panel"><h3>Your Pond</h3><div id="pond"></div></div>
    <div class="panel"><h3>Duck Shop</h3><div id="shop"></div></div>
  </div>

  <div class="col">
    <div class="panel"><h3>🏆 Leaderboard</h3><ol id="board"></ol></div>
    <div class="panel">
      <h3>Chat</h3>
      <div id="chatlog"></div>
      <input id="chatin" maxlength="120" placeholder="Say something...">
    </div>
  </div>
</main>

<div id="toast"></div>

<!-- Core Game Setup Script -->
<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const COLORS = [55,50,200,45,120,190,30,60,42,180,350,150,185,170,200,20,195,270,0,290];

// Safe formatting wrapper
function F(num) {
  const val = Number(num);
  if (isNaN(val) || val === undefined || val === null) return "0";
  if (window.Config && typeof Config.Format === "function") return Config.Format(val);
  if (val >= 1e12) return (val / 1e12).toFixed(2) + "T";
  if (val >= 1e9) return (val / 1e9).toFixed(2) + "B";
  if (val >= 1e6) return (val / 1e6).toFixed(2) + "M";
  if (val >= 1e3) return (val / 1e3).toFixed(1) + "K";
  return Math.floor(val).toLocaleString();
}

let token = localStorage.getItem("duckToken");
if (!token) { 
  token = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2)) + Date.now(); 
  localStorage.setItem("duckToken", token); 
}
$("nameIn").value = localStorage.getItem("duckName") || "";

var ws = null; // Exposed globally so admin1.js can access ws
let state = null;
let autoPickInterval = null, autoSellInterval = null;

function toast(msg) { 
  const t = $("toast"); t.textContent = msg; t.style.display = "block"; 
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 4000); 
}

function connect() {
  const wsProtocol = location.protocol === "https:" ? "wss://" : "ws://";
  const wsHost = location.host || "mr-duck.onrender.com";
  
  ws = new WebSocket(wsProtocol + wsHost);
  
  ws.onopen = () => {
    toast("Connected to server!");
    ws.send(JSON.stringify({ t: "login", token, name: $("nameIn").value }));
  };
  
  ws.onclose = () => { 
    toast("Server reconnecting... retrying in 3s"); 
    setTimeout(connect, 3000); 
  };
  
  ws.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      // Pass message to admin1.js module listener if present
      if (typeof window.onExtraMsg === "function") {
        window.onExtraMsg(m);
      }
      
      if (m.t === "welcome") { 
        $("login").style.display = "none"; 
        if (m.offline > 0) toast("Earned " + F(m.offline) + " coins while away!"); 
      }
      else if (m.t === "state") { 
        state = m; 
        render(); 
      }
      else if (m.t === "board") renderBoard(m);
      else if (m.t === "chat") addChat(m.name, m.msg);
      else if (m.t === "err" || m.t === "toast") toast(m.msg);
    } catch(err) { console.error("Parse error:", err); }
  };
}

$("joinBtn").onclick = () => {
  const name = $("nameIn").value.trim() || "Duck Master";
  localStorage.setItem("duckName", name);

  if (!state) {
    state = {
      Coins: 0, Income: 0, Lemons: 0, LemonRate: 0, Eggs: 0, Total: 0, Slots: 10, Stage: 1, Rebirths: 0,
      Ducks: (window.Config && Config.DuckNames) ? new Array(Config.DuckNames.length).fill(0) : [0,0,0,0,0]
    };
  }

  $("login").style.display = "none";
  render();

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    connect();
  }
};

$("nameIn").addEventListener("keydown", (e) => { if (e.key === "Enter") $("joinBtn").click(); });

const act = (a, arg) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t: "act", a, arg }));

$("lemon").onclick = () => act("PickLemons");
$("sell").onclick = () => act("SellLemons");
$("upgrade").onclick = () => act("UpgradeLemon");
$("rebirth").onclick = () => { 
  if (confirm("Rebirth resets coins, lemons, ducks, and lemon stage for a permanent multiplier. Continue?")) {
    act("Rebirth");
  }
};

// Automation Toggles
$("autoPickBtn").onclick = function() {
  if (autoPickInterval) {
    clearInterval(autoPickInterval); autoPickInterval = null;
    this.textContent = "🤖 Auto-Pick: OFF"; this.classList.remove("active");
  } else {
    autoPickInterval = setInterval(() => act("PickLemons"), 300);
    this.textContent = "🤖 Auto-Pick: ON"; this.classList.add("active");
  }
};

$("autoSellBtn").onclick = function() {
  if (autoSellInterval) {
    clearInterval(autoSellInterval); autoSellInterval = null;
    this.textContent = "⚡ Auto-Sell: OFF"; this.classList.remove("active");
  } else {
    autoSellInterval = setInterval(() => act("SellLemons"), 500);
    this.textContent = "⚡ Auto-Sell: ON"; this.classList.add("active");
  }
};

// Populate Shop Items
const shopEls = [];
function initShop() {
  const shop = $("shop");
  shop.innerHTML = "";
  if (!window.Config || !Config.DuckNames) return;
  Config.DuckNames.forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "shopitem";
    b.style.background = `hsl(${COLORS[i % COLORS.length]},80%,75%)`;
    b.onclick = () => act("BuyDuck", i + 1);
    shop.appendChild(b);
    shopEls.push(b);
  });
}

function render() {
  const s = state;
  if (!s) return;

  if (!shopEls.length && window.Config) initShop();

  // Safely render Currency Counters
  $("coins").textContent = `💰 ${F(s.Coins || 0)} (+${F(s.Income || 0)}/s)`;
  $("lemons").textContent = `🍋 ${F(s.Lemons || 0)} (+${F(s.LemonRate || 0)}/s)`;
  $("eggs").textContent = `🥚 ${F(s.Eggs || 0)}`;
  $("ducks").textContent = `🦆 ${s.Total || 0}/${s.Slots || 10}`;

  const stageIdx = s.Stage || 1;
  const stageName = (Config.StageNames && Config.StageNames[stageIdx - 1]) ? Config.StageNames[stageIdx - 1] : "Stage " + stageIdx;
  const stageObj = Config.Stage ? Config.Stage(stageIdx) : { SellPrice: 1, PickAmount: 1 };
  
  $("stage").textContent = `${stageName} (${F(stageObj.SellPrice)}c/lemon)`;
  
  const mult = Config.RebirthMult ? Config.RebirthMult(s.Rebirths || 0) : (1 + (s.Rebirths || 0));
  $("reb").textContent = `🔄 x${Number(mult).toFixed(2)}`;
  $("lemon").textContent = `🍋 Pick Lemons (+${stageObj.PickAmount})`;

  const nextStage = stageIdx + 1;
  if (Config.StageNames && nextStage <= Config.StageNames.length) {
    const cost = Config.Stage(nextStage).Cost;
    $("upgrade").textContent = `⬆ ${Config.StageNames[nextStage - 1]} (${F(cost)})`;
    $("upgrade").disabled = (s.Coins || 0) < cost;
  } else { 
    $("upgrade").textContent = "MAX Lemon Stage!"; 
    $("upgrade").disabled = true; 
  }

  const rebCost = Config.RebirthCost ? Config.RebirthCost(s.Rebirths || 0) : 1e6;
  const nextMult = Config.RebirthMult ? Config.RebirthMult((s.Rebirths || 0) + 1) : 2;
  $("rebirth").textContent = `🔄 Rebirth #${(s.Rebirths || 0) + 1} (${F(rebCost)}) → x${Number(nextMult).toFixed(2)}`;
  $("rebirth").disabled = (s.Coins || 0) < rebCost;

  // Shop update
  shopEls.forEach((b, i) => {
    const cost = Config.DuckCost(i + 1);
    const owned = (s.Ducks && s.Ducks[i]) ? s.Ducks[i] : 0;
    b.innerHTML = `<span><b>${Config.DuckNames[i]}</b><small>+${F(Config.DuckIncome(i + 1))}/s · owned ${owned}</small></span><span>${F(cost)}</span>`;
    b.disabled = (s.Coins || 0) < cost || (s.Total || 0) >= (s.Slots || 10);
  });

  // Pond ducks render
  if (s.Ducks) {
    const key = s.Ducks.join(",");
    if (render.key !== key) {
      render.key = key;
      const pond = $("pond"); pond.innerHTML = "";
      let n = 0;
      s.Ducks.forEach((cnt, i) => {
        for (let k = 0; k < cnt; k++) {
          const d = document.createElement("div");
          d.className = "duck"; d.textContent = "🦆";
          d.style.fontSize = (24 + i * 1.2) + "px";
          d.style.filter = `hue-rotate(${COLORS[i % COLORS.length] - 50}deg) saturate(1.3)`;
          d.style.animationDelay = (n++ % 10) * 0.2 + "s";
          d.title = Config.DuckNames[i] || "Duck";
          pond.appendChild(d);
        }
      });
    }
  }
}

function renderBoard(m) {
  $("board").innerHTML = "";
  if (m.rows) {
    m.rows.forEach((r) => { 
      const li = document.createElement("li"); 
      li.textContent = `${r.name} — ${r.rebirths || 0} rebirths, ${F(r.earned || 0)} earned`; 
      $("board").appendChild(li); 
    });
  }

  $("online").innerHTML = "";
  if (m.players) {
    m.players.forEach((p) => { 
      const li = document.createElement("li"); 
      const stName = (Config.StageNames && Config.StageNames[p.stage - 1]) ? Config.StageNames[p.stage - 1] : "Stage " + p.stage;
      li.textContent = `${p.name} — 🦆${p.ducks || 0} · ${stName}`; 
      $("online").appendChild(li); 
    });
  }
}

function addChat(name, msg) {
  const div = document.createElement("div");
  const b = document.createElement("b"); b.textContent = name + ": ";
  div.appendChild(b); div.appendChild(document.createTextNode(msg));
  const log = $("chatlog"); log.appendChild(div); log.scrollTop = log.scrollHeight;
  while (log.children.length > 80) log.removeChild(log.firstChild);
}

$("chatin").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.value.trim()) { 
    act("Chat", e.target.value.trim()); 
    e.target.value = ""; 
  }
});
</script>

<!-- Load the client-side hidden admin panel module -->
<script src="admin1.js"></script>
</body>
</html>
