<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Duck & Lemon Tycoon</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #ui-layer {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      text-shadow: 1px 1px 3px black;
      pointer-events: none;
      z-index: 10;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-layer">
    <h2 id="coins-display">Coins: 0</h2>
    <h3 id="lemons-display">Lemons: 0</h3>
    <p>Click screen to move camera. WASD to walk.</p>
  </div>
  <div id="crosshair"></div>

  <script src="config.js"></script>
  <script src="game3d.js"></script>
</body>
</html>
